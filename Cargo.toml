[package]
name = "libproxybase"
version = "0.1.0"
edition = "2021"
description = "Core engine library for ProxyBase networking, market connectivity, proxying, and telemetry"
license = "MIT"
readme = "README.md"
repository = "https://github.com/proxybase/proxybase2"
keywords = ["proxy", "socks5", "networking", "telemetry", "market"]
categories = ["network-programming", "asynchronous"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
yamux = "0.13"
rustls = "0.23"
k256 = { version = "0.13", features = ["ecdsa"] }
bip39 = { version = "2", features = ["rand"] }
aes-gcm = "0.10"
argon2 = "0.5"
governor = "0.7"
sysinfo = "0.31"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
bytes = "1"
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha3 = "0.10"
dashmap = "6"
url = "2"

[dev-dependencies]
tempfile = "3"
